# CI on every push and pull request; CD on pushes to main only (A2 §5).
# CD jobs `need` the CI jobs, so they can only run when CI passed on this same commit.
name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  SERVICES: roadmap progress

jobs:
  # ── CI ─────────────────────────────────────────────────────────────────
  validate:
    name: validate system.yaml and OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.29.4 openapi-spec-validator==0.7.1
      - name: system.yaml against system.schema.json
        run: check-jsonschema --schemafile system.schema.json system.yaml
      - name: Each openapi.yaml against the OpenAPI specification
        run: openapi-spec-validator services/roadmap/openapi.yaml services/progress/openapi.yaml

  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [roadmap, progress]
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CI_Only_SA_2026      # throwaway container that lives for this job only
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CI_Only_SA_2026 -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s --health-timeout 5s --health-retries 30 --health-start-period 20s
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      # Same script as local compose: one database and one login per service.
      - name: Create the test databases
        working-directory: .
        run: |
          docker cp db/init.sql ${{ job.services.mssql.id }}:/tmp/init.sql
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P CI_Only_SA_2026 -C -b -i /tmp/init.sql \
            -v ROADMAP_DB_PASSWORD=CI_Roadmap_2026 PROGRESS_DB_PASSWORD=CI_Progress_2026
      - name: Tests with coverage (fails under 70%)
        env:
          TEST_DATABASE_URL: >-
            mssql+pymssql://${{ matrix.service }}_svc:${{ matrix.service == 'roadmap' && 'CI_Roadmap_2026' || 'CI_Progress_2026' }}@localhost:1433/${{ matrix.service }}_test
        run: pytest -q --cov=. --cov-report=term-missing --cov-fail-under=70

  build:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [roadmap, progress]
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t ${{ matrix.service }}:ci services/${{ matrix.service }}

  # ── CD: main only ──────────────────────────────────────────────────────
  publish:
    name: push image (${{ matrix.service }})
    needs: [validate, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # GITHUB_TOKEN may push to this repo owner's GHCR
    strategy:
      matrix:
        service: [roadmap, progress]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          build-args: GIT_SHA=${{ github.sha }}
          # Container Apps can't pull images that carry an attestation manifest (setup guide step 8).
          provenance: false
          push: true
          # The commit SHA is the deployable tag; latest is only a convenience.
          tags: |
            ghcr.io/g-lifshitz/cybersec-roadmap-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/g-lifshitz/cybersec-roadmap-${{ matrix.service }}:latest

  deploy:
    name: deploy to Azure
    needs: [publish]
    runs-on: ubuntu-latest
    concurrency: deploy-azure        # never two deploys at once
    permissions:
      contents: read
      id-token: write                # OIDC token for azure/login: no Azure password stored
    env:
      RG: ${{ vars.RESOURCE_GROUP }}
      PREFIX: ${{ vars.PREFIX }}
      SQL_HOST: ${{ vars.SQL_SERVER }}.database.windows.net
      UI_ORIGIN: ${{ vars.UI_ORIGIN }}
      IMAGE_BASE: ghcr.io/g-lifshitz/cybersec-roadmap
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Find both services' public URLs
        run: |
          az extension add --name containerapp --upgrade --yes --only-show-errors
          for svc in $SERVICES; do
            fqdn=$(az containerapp show -n "$PREFIX-$svc" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
            echo "$(echo "$svc" | tr a-z A-Z)_PUBLIC_URL=https://$fqdn" >> "$GITHUB_ENV"
          done

      # Secrets go to Container Apps as secrets and reach the app as secretref:,
      # never as plain environment variables.
      - name: Deploy roadmap
        env:
          DB_PASSWORD: ${{ secrets.ROADMAP_DB_PASSWORD }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
        run: |
          app="$PREFIX-roadmap"
          az containerapp secret set -n "$app" -g "$RG" --only-show-errors -o none --secrets \
            "database-url=mssql+pymssql://roadmap_svc:${DB_PASSWORD}@${SQL_HOST}:1433/${PREFIX}-roadmap-db?encryption=require" \
            "token-secret=${TOKEN_SECRET}"
          az containerapp ingress update -n "$app" -g "$RG" --target-port 8000 --only-show-errors -o none
          az containerapp update -n "$app" -g "$RG" --only-show-errors -o none \
            --image "$IMAGE_BASE-roadmap:${{ github.sha }}" \
            --min-replicas 0 --max-replicas 1 \
            --set-env-vars DATABASE_URL=secretref:database-url TOKEN_SECRET=secretref:token-secret \
              CORS_ORIGINS="$UI_ORIGIN" PROGRESS_URL="$PROGRESS_PUBLIC_URL" TRUST_PROXY=1 GIT_SHA=${{ github.sha }}

      - name: Deploy progress
        env:
          DB_PASSWORD: ${{ secrets.PROGRESS_DB_PASSWORD }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
        run: |
          app="$PREFIX-progress"
          az containerapp secret set -n "$app" -g "$RG" --only-show-errors -o none --secrets \
            "database-url=mssql+pymssql://progress_svc:${DB_PASSWORD}@${SQL_HOST}:1433/${PREFIX}-progress-db?encryption=require" \
            "token-secret=${TOKEN_SECRET}"
          az containerapp ingress update -n "$app" -g "$RG" --target-port 8000 --only-show-errors -o none
          az containerapp update -n "$app" -g "$RG" --only-show-errors -o none \
            --image "$IMAGE_BASE-progress:${{ github.sha }}" \
            --min-replicas 0 --max-replicas 1 \
            --set-env-vars DATABASE_URL=secretref:database-url TOKEN_SECRET=secretref:token-secret \
              CORS_ORIGINS="$UI_ORIGIN" ROADMAP_URL="$ROADMAP_PUBLIC_URL" TRUST_PROXY=1 GIT_SHA=${{ github.sha }}

      # The UI needs no build step; only config.js changes, pointing at the Azure services.
      - name: Upload the UI to the static website
        run: |
          cat > ui/config.js <<EOF
          // Written by the CD pipeline at deploy time (commit ${{ github.sha }}).
          window.APP_CONFIG = {
            ROADMAP_URL: "$ROADMAP_PUBLIC_URL",
            PROGRESS_URL: "$PROGRESS_PUBLIC_URL",
          };
          EOF
          az storage blob upload-batch --account-name "${{ vars.UI_STORAGE }}" --auth-mode key \
            --destination '$web' --source ui --overwrite --only-show-errors -o none

      # A cold start plus a paused database can take a couple of minutes: wait up to 6.
      - name: Health check both services
        run: |
          for svc in ROADMAP PROGRESS; do
            url="$(printenv ${svc}_PUBLIC_URL)/health"
            for attempt in $(seq 1 24); do
              code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 30 "$url" || true)
              echo "$svc attempt $attempt: HTTP $code $(cat /tmp/health.json 2>/dev/null)"
              [ "$code" = 200 ] && break
              sleep 15
            done
            [ "$code" = 200 ] || { echo "::error::$svc /health did not return 200"; exit 1; }
            grep -q '"version":"${{ github.sha }}"' /tmp/health.json \
              || { echo "::error::$svc is healthy but not running ${{ github.sha }}"; exit 1; }
          done
