{% extends "base.html" %}
{% block title %}Edit {{ item.title }}{% endblock %}
{% block content %}
<div class="form-page">
  <a href="{{ url_for('item_detail', item_id=item.id) }}" class="back">&larr; Back to item</a>
  <p class="eyebrow">Roadmap</p>
  <h1>Edit item</h1>
  <form method="POST" action="{{ url_for('edit_item', item_id=item.id) }}" class="card form-card">
    {% include "_item_form.html" %}
    <div class="form-actions">
      <a href="{{ url_for('item_detail', item_id=item.id) }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Save changes</button>
    </div>
  </form>
</div>
{% endblock %}
