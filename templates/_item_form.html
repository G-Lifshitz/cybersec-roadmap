{# Shared by add.html and edit.html. Expects: item (dict, may be empty), item_types, platforms, difficulties #}
<div class="field">
  <label for="title">Title <span class="req">*</span></label>
  <input id="title" type="text" name="title" required maxlength="200" value="{{ item.title or '' }}"
         placeholder="e.g. Practical Ethical Hacking" autofocus>
</div>

<div class="field">
  <span class="field-label">Type</span>
  <div class="segmented">
    {% for t in item_types %}
    <label><input type="radio" name="type" value="{{ t }}" {% if (item.type or 'course') == t %}checked{% endif %}><span>{{ t }}</span></label>
    {% endfor %}
  </div>
</div>

<div class="field-grid">
  <div class="field">
    <label for="platform">Platform</label>
    <select id="platform" name="platform">
      <option value="">None</option>
      {% for p in platforms %}
      <option value="{{ p }}" {% if item.platform == p %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="url">Link</label>
    <input id="url" type="url" name="url" value="{{ item.url or '' }}" placeholder="https://">
  </div>
</div>

<div class="field">
  <span class="field-label">Difficulty</span>
  <div class="segmented segmented-diff">
    {% for d in difficulties %}
    <label class="d-{{ d }}"><input type="radio" name="difficulty" value="{{ d }}" {% if (item.difficulty or 'beginner') == d %}checked{% endif %}><span>{{ d }}</span></label>
    {% endfor %}
  </div>
</div>

<div class="field">
  <span class="field-label">Priority <span class="hint">5 = do this first</span></span>
  <div class="segmented segmented-prio">
    {% for n in range(1, 6) %}
    <label><input type="radio" name="priority" value="{{ n }}" {% if (item.priority or 3) == n %}checked{% endif %}><span>{{ n }}</span></label>
    {% endfor %}
  </div>
</div>

<div class="field">
  <label for="skill_tags">Skill tags <span class="hint">comma-separated</span></label>
  <input id="skill_tags" type="text" name="skill_tags" maxlength="200" value="{{ item.skill_tags or '' }}"
         placeholder="web, network, active directory">
</div>
