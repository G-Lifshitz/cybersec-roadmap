{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth-head">
    <h1>Welcome back</h1>
    <p class="muted">Log in to pick up where you left off.</p>
  </div>
  <form method="POST" class="card auth-card">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" name="username" value="{{ username }}" required autofocus autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>
  <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
