{% extends "base.html" %}
{% block title %}Add item{% endblock %}
{% block content %}
<div class="form-page">
  <a href="{{ url_for('index') }}" class="back">&larr; Roadmap</a>
  <p class="eyebrow">Roadmap</p>
  <h1>Add to roadmap</h1>
  <p class="muted">A course, cert, lab, book or project you want to work through.</p>
  <form method="POST" action="{{ url_for('add_item') }}" class="card form-card">
    {% include "_item_form.html" %}
    <div class="form-actions">
      <a href="{{ url_for('index') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Add item</button>
    </div>
  </form>
</div>
{% endblock %}
